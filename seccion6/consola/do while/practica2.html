<!DOCTYPE html>
<html lang="es">
<head><title>Tabla</title></head>
<body>
    <script>
        function tabla() {
            let num = Number(prompt("Introduce un número:"));
            let i = 1;
            console.log(`--- Tabla del ${num} ---`);
            do {
                console.log(`${num} x ${i} = ${num * i}`);
                i++;
            } while (i <= 10);
        }
        tabla();
    </script>
</body>
</html>

<!DOCTYPE html>
<html>
<head><title>Vueltas</title></head>
<body>
    <script>
        function contarVueltas(max) {
            let i = 1;
            while (i <= max) {
                let texto = "Vuelta número: " + i;
                console.log(texto); 
                document.write("<p>" + texto + "</p>"); 
                i++;
            }
        }

        let num = Number(prompt("¿Cuántas vueltas"));
        contarVueltas(num);
    </script>
</body>
</html>

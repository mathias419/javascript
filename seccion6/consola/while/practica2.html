<!DOCTYPE html>
<html>
<head><title>Test Loop</title></head>
<body>
    <script>
        function testLoop(numero) {
            
            while (numero <= 10) {
                console.log(numero);
                numero++; 
            }
        }

        let inicial = Number(prompt("Introduce un número inicial (menor a 10):"));
        testLoop(inicial);
    </script>
</body>
</html>

<!DOCTYPE html>
<html>
<head><title>Suma For Of</title></head>
<body>
    <script>
        let miArray = (5, 9, 6, 4, 8);
        let suma = 0;
        function testLoop(lista) {
            for (let numero of lista) {
                suma += numero;
            }
            console.log("Resultado: " + suma);
        }
        testLoop(miArray);
    </script>
</body>
</html>

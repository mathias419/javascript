<!doctype html>
<html>
  <head>
    <title>Loop Mensajes</title>
  </head>
  <body>
    <script>
      let miArray = ("Mensaje 1", "Mensaje 2", "Mensaje 3");

      function testLoop(lista) {
        for (let mensaje of lista) {
          console.log(mensaje);
        }
      }
      testLoop(miArray);
    </script>
  </body>
</html>

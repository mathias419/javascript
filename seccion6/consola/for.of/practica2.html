<!doctype html>
<html>
  <head>
    <title>Loop Mensajes</title>
  </head>
  <body>
    <script>
      let miArray = ("Mensaje 1", "Mensaje 2", "Mensaje 3");

      function testLoop() {
        for (let mensaje of miArray) {
          console.log(mensaje);
        }
      }
      testLoop(miArray);
    </script>
  </body>
</html>

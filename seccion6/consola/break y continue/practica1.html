<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Prueba de Bucle con Break</title>
  </head>
  <body>
    <script>
      let miArray = ["A", "A", "B", "A", "B", "B", "A"];

      function testLoop(arr) {
        for (let letra of arr) {
          if (letra === "B") {
            break;
          }
          console.log(letra);
        }
      }

      
      testLoop(miArray);
    </script>
  </body>
</html>

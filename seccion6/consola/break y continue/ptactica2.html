<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Prueba de Bucle con Continue</title>
</head>
<body>

    <script>
        let miArray = 
        [9, 5, 6, 2, 7];

        function testLoop(arr) {
            for (let n of arr) {
                if (n <= 5) continue;
                console.log(n);
            }
        }

        testLoop(miArray);
    </script>
</html>
